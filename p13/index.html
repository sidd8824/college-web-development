
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Positioning Demo</h1>

    <div class="container">
        <div class="box static">Static</div>
        <div class="box relative">Relative</div>
        <div class="box absolute">Absolute</div>
        <div class="box fixed">Fixed</div>
        <div class="box sticky">Sticky</div>
    </div>

    <div class="content">
        <h2>Scroll Down</h2>
        <p>This section lets you test the sticky and fixed positions.</p>
        <p>Keep scrolling to observe how the boxes behave.</p>
        <p>CSS positioning controls where elements appear on a webpage.</p>
        <p>Scroll further to see the sticky box in action.</p>
    </div>

</body>
</html>
